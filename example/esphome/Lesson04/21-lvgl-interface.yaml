i2c:
  sda: GPIO38                         # I2C SDA pin (data line)
  scl: GPIO39                         # I2C SCL pin (clock line)
  id: bus_a                           # Unique ID for this I2C bus
  scan: true                          # Auto-scan for I2C devices on boot

pcf8574:
  - id: pcf                           # Unique ID for PCF8574 I/O expander
    address: 0x21                     # I2C address of PCF8574 module
    
output:
  - platform: ledc  # Use LEDC (PWM) controller for backlight dimming
    pin: 6                            # GPIO pin for backlight PWM signal
    id: bl_pwm                        # Unique ID for backlight PWM output
    frequency: 19531Hz                # PWM frequency (chosen to avoid flicker)

  - platform: gpio  # GPIO output for LCD power control
    id: lcd_power                    # Unique ID for LCD power control
    pin:
      pcf8574: pcf                   # Use PCF8574 I/O expander for this pin
      number: 3                      # PCF8574 pin number (3)
      mode:
        output: true                 # Configure pin as output
      inverted: false                # Normal logic (HIGH = power on)

  - platform: gpio  # GPIO output for display reset control
    id: display_reset                # Unique ID for display reset control
    pin:
      pcf8574: pcf                   # Use PCF8574 I/O expander for this pin
      number: 4                      # PCF8574 pin number (4)
      mode:
        output: true                 # Configure pin as output
      inverted: true                 # Inverted logic (LOW = reset active)
        
# Global variables (defined only, assigned in code)
globals:
  - id: brightness_value
    type: int                        # Integer type for brightness (0-100%)
    restore_value: false             # Do not restore value from flash memory
    initial_value: "50"              # Default brightness value on boot

  - id: encoder_ready
    type: bool                       # Boolean flag to enable/disable encoder
    restore_value: false             # Do not restore value from flash memory
    initial_value: "false"           # Disable encoder by default (enable after boot)

# Rotary encoder configuration
sensor:
  - platform: rotary_encoder  # Rotary encoder sensor platform
    id: knob                         # Unique ID for rotary encoder
    name: "Encoder"                  # Sensor name (for HA integration)

    pin_a:
      number: 42                          # GPIO pin for encoder CLK (channel A)
      mode:
        input: true                       # Configure as input pin
        pullup: true                      # Enable internal pull-up resistor (noise reduction)
    pin_b:
      number: 4                           # GPIO pin for encoder DT (channel B)
      mode:
        input: true                       # Configure as input pin
        pullup: true                      # Enable internal pull-up resistor (noise reduction)

    filters:
      - debounce: 20ms              # Debounce filter (20ms) to reduce signal noise
      - lambda: return round(x);     # Round encoder value to integer

    resolution: 1                    # Encoder resolution (1 step per detent)
    internal: true  # Mark as internal (hide from HA frontend)
    
    on_value:  # Trigger when encoder value changes
      then:
        - lambda: |-
            if (!id(encoder_ready)) return; // Exit if encoder is not ready (boot phase)
            static bool first_run = true;   // Static flag for first execution
            static int last_encoder = 0;    // Static variable to store last encoder value
            int current = (int)id(knob).state; // Get current encoder state as integer

            if (first_run) { // Initialize on first run
              last_encoder = current; // Set baseline to current value
              first_run = false;      // Clear first run flag
              return;                 // Exit to avoid false adjustment
            }

            int delta = current - last_encoder; // Calculate change in encoder value
            last_encoder = current;             // Update last value for next iteration
            if (delta == 0) return;             // Exit if no actual change (noise)

            static int acc = 0; // Static accumulator for delta values (debouncing)
            acc += delta;       // Accumulate delta values

            if (abs(acc) >= 1) { // Process only if accumulated change >= 1 (stable signal)
              // Adjust brightness: +5% for CCW, -5% for CW (acc > 0 = CW)
              id(brightness_value) += (acc > 0) ? -5 : 5;
              // Clamp brightness to 0-100% range (prevent out-of-bounds values)
              id(brightness_value) = clamp(id(brightness_value), 0, 100);
              
              float level = id(brightness_value) / 100.0f; // Convert to 0.0-1.0 for PWM
              id(bl_pwm).set_level(level); // Update backlight PWM level
              
              lv_arc_set_value(id(arc_brightness), id(brightness_value)); // Update LVGL arc
              
              char buf[10]; // Temporary buffer for percentage string
              // Format brightness as "X%" string
              snprintf(buf, sizeof(buf), "%d%%", id(brightness_value));
              lv_label_set_text(id(lbl_brightness), buf); // Update LVGL brightness label
              
              lv_refr_now(NULL); // Force immediate LVGL screen refresh
              acc = 0; // Reset accumulator for next iteration
            }

# Backlight light component (for HA integration)
light:
  - platform: monochromatic  # Monochromatic light platform (single color/brightness)
    name: "LCD Backlight"             # Light entity name (for HA)
    output: bl_pwm                    # Link to backlight PWM output
    id: display_backlight             # Unique ID for backlight light entity
    default_transition_length: 0s     # No fade transition (instant change)
    restore_mode: ALWAYS_ON           # Always turn on backlight after boot

font:
  - file: "gfonts://Montserrat"  # Load Montserrat font from Google Fonts
    id: montserrat_25            # Unique ID for 25px Montserrat font
    size: 25                     # Font size in pixels
  - file: "gfonts://Montserrat"  # Load Montserrat font from Google Fonts
    id: montserrat_50            # Unique ID for 50px Montserrat font
    size: 50                     # Font size in pixels
  - file: "gfonts://Montserrat"  # Load Montserrat font from Google Fonts
    id: montserrat_14            # Unique ID for 14px Montserrat font
    size: 14                     # Font size in pixels
  - file: "gfonts://Montserrat"  # Load Montserrat font from Google Fonts
    id: montserrat_12            # Unique ID for 12px Montserrat font
    size: 12                     # Font size in pixels

image:
  - file: "bj_light_21_1.png"         # Path to background image file
    id: img_bg_light          # Unique ID for light background image
    resize: 480x480          # Resize image to match display resolution
    type: RGB565             # Use RGB565 color format (memory efficient)

spi:
  clk_pin: 2                          # SPI clock pin (SCK)
  mosi_pin: 1                         # SPI MOSI pin (data out)

# Display driver configuration
display:
  - platform: st7701s                 # ST7701S display controller driver
    id: my_display                    # Unique ID for display
    update_interval: 50ms             # Screen refresh interval (20 FPS)
    spi_mode: MODE3                   # SPI communication mode 3 (CPOL=1, CPHA=1)
    color_order: RGB                  # Color data order (RGB)
    invert_colors: false              # Do not invert display colors
    dimensions:
      width: 480                      # Display width in pixels
      height: 480                     # Display height in pixels
    cs_pin: 16                        # SPI chip select pin
    de_pin: 40                        # Display data enable pin
    hsync_pin: 15                     # Horizontal sync pin
    vsync_pin: 7                      # Vertical sync pin
    pclk_pin: 41                      # Pixel clock pin
    data_pins:  # RGB data pins for ST7701S (5R/6G/5B configuration)
      red: [46, 3, 8, 18, 17]          # Red channel data pins
      green: [14, 13, 12, 11, 10, 9]   # Green channel data pins
      blue: [5, 45, 48, 47, 21]        # Blue channel data pins
    # Display timing parameters (per ST7701S datasheet)
    hsync_front_porch: 20              # Horizontal front porch pixels
    hsync_pulse_width: 10              # Horizontal sync pulse width
    hsync_back_porch: 10               # Horizontal back porch pixels
    vsync_front_porch: 8               # Vertical front porch lines
    vsync_pulse_width: 10              # Vertical sync pulse width
    vsync_back_porch: 10               # Vertical back porch lines
    show_test_card: false              # Disable default test pattern
    pclk_frequency: 18MHz              # Pixel clock frequency (18MHz)
    pclk_inverted: true                # Invert pixel clock signal
    init_sequence:  # ST7701S initialization command sequence (manufacturer specified)
      - [0x01]                        # Software reset command
      - delay 120ms                    # Wait for reset completion
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]  # Extended command set
      - [0xC0, 0x3B, 0x00]            # Power control 1
      - [0xC1, 0x0B, 0x02]            # Power control 2
      - [0xC2, 0x00, 0x02]            # Power control 3
      - [0xCC, 0x10]                  # Panel control
      - [0xCD, 0x08]                  # Panel control
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]  # Gamma setting 1
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]  # Gamma setting 2
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]  # Extended command set
      - [0xB0, 0x5d]                  # VCOM control 1
      - [0xB1, 0x43]                  # VCOM control 2
      - [0xB2, 0x81]                  # VCOM control 3
      - [0xB3, 0x80]                  # VCOM control 4
      - [0xB5, 0x43]                  # Frame rate control
      - [0xB7, 0x85]                  # Power saving control
      - [0xB8, 0x20]                  # Display mode control
      - [0xC1, 0x78]                  # Gamma adjustment 1
      - [0xC2, 0x78]                  # Gamma adjustment 2
      - [0xD0, 0x88]                  # Power control 4
      - [0xE0, 0x00, 0x00, 0x02]      # Color enhancement 1
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]  # Color enhancement 2
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]  # Color enhancement 3
      - [0xE3, 0x00, 0x00, 0x11, 0x00]  # Color enhancement 4
      - [0xE4, 0x22, 0x00]            # Color enhancement 5
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]  # Color enhancement 6
      - [0xE6, 0x00, 0x00, 0x11, 0x00]  # Color enhancement 7
      - [0xE7, 0x22, 0x00]            # Color enhancement 8
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]  # Color enhancement 9
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]  # Color enhancement 10
      - [0xEd, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]  # Color enhancement 11
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]  # Color enhancement 12
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]  # Extended command set
      - [0xEF, 0x08]                  # Display control
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]  # Exit extended command set
      - [0x36, 0x08]                  # Memory access control (rotation)
      - [0x3A, 0x60]                  # Interface pixel format (RGB565)
      - [0x11]                        # Exit sleep mode
      - delay 100ms                    # Wait for display to wake up
      - [0x29]                        # Turn on display
      - delay 50ms                    # Wait for display to activate

lvgl:
  displays:
    - my_display  # Link LVGL to the ST7701S display
  buffer_size: 50%  # Allocate 50% of available memory for LVGL buffer (for 480x480 screen)

  widgets:  # LVGL graphical widgets configuration
    - image:  # Background image widget
        align: CENTER  # Align image to screen center
        id: img_bg     # Unique ID for background image widget
        src: img_bg_light  # Source image (defined in image section)
        width: 480     # Image width (match display)
        height: 480    # Image height (match display)
        antialias: true  # Enable anti-aliasing for smoother edges

    - label:  # Title label widget
        align: CENTER  # Align label to screen center
        id: lbl_title  # Unique ID for title label
        y: -50         # Vertical offset (50px up from center)
        text_font: montserrat_25  # Use 25px Montserrat font
        text: "Brightness"  # Label text content
        text_color: 0xFFFFFF  # Text color (white, hex RGB)
        text_opa: "100%"      # Text opacity (100% = fully opaque)

    - arc:  # Brightness arc widget (visual indicator)
        id: arc_brightness  # Unique ID for brightness arc
        align: CENTER       # Align arc to screen center
        y: 0                # No vertical offset (center)
        width: 360          # Arc width in pixels
        height: 360         # Arc height in pixels
        rotation: 0         # No additional rotation
        start_angle: 135    # Arc start angle (135 degrees)
        end_angle: 45       # Arc end angle (45 degrees) - 270° total arc
        min_value: 0        # Minimum arc value (0% brightness)
        max_value: 100      # Maximum arc value (100% brightness)
        value: 50           # Initial arc value (50%)
        
        arc_color: 0x1A1A1A  # Background arc color (dark gray)
        arc_width: 12        # Arc line width in pixels
        arc_rounded: true    # Rounded arc line ends
        
        indicator:  # Active indicator (current brightness)
          arc_color: 0x00D2FF  # Indicator color (cyan)
          arc_width: 12        # Indicator line width
          arc_rounded: true    # Rounded indicator ends
        
        knob:  # Arc knob (end of indicator)
          bg_color: 0xFFFFFF  # Knob background color (white)
          bg_opa: "100%"      # Knob opacity (100%)
          width: 15           # Knob width
          height: 15          # Knob height
          radius: 7           # Knob corner radius (near-circle)

    - label:  # Brightness percentage label
        align: CENTER  # Align label to screen center
        id: lbl_brightness  # Unique ID for brightness label
        y: 0                # No vertical offset (center, over arc)
        text_font: montserrat_50  # Use 50px Montserrat font (large, readable)
        text: "50%"         # Initial text (50%)
        text_color: 0xFFFFFF  # Text color (white)
        text_opa: "100%"      # Text opacity (100%)