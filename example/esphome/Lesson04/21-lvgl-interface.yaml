esphome:
  name: 21-lvgl-interface  # Device unique name for ESPHome
  friendly_name: 2.1_LVGL_Interface  # Human-readable device name
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"  # Enable PSRAM support at compile time
    board_build.esp-idf.memory_type: qio_opi  # Configure flash memory type as QIO/OPI
    board_build.flash_mode: dio       # Set flash communication mode to DIO

  on_boot:
    priority: 800                     # High priority (execute early in boot sequence)
    then:
      # Power and reset initialization
      - output.turn_on: lcd_power       # Activate power supply for LCD display
      - output.turn_on: display_reset   # Assert reset signal to initialize display
      - delay: 100ms                    # Wait for reset signal to take effect (timing requirement)
      - output.turn_off: display_reset  # Release display from reset state
      - delay: 100ms                    # Allow display hardware to stabilize

      # Wait for rotary encoder to stabilize
      - delay: 500ms                    # Prevent encoder signal noise during boot

      # Initial brightness (0.5 = 50%)
      - light.turn_on:
          id: display_backlight       # Target backlight light entity
          brightness: 0.5             # Set initial backlight brightness to 50%

      # === Initialize brightness and encoder (frozen state) ===
      - lambda: |-
          id(encoder_ready) = false;  // Disable encoder processing during initialization
          id(brightness_value) = 50;  // Set internal brightness tracking value to 50%
          id(knob).publish_state(0);  // Reset encoder internal state to 0 for alignment

      # Initial brightness again (ensure light state is correct)
      - light.turn_on:
          id: display_backlight       # Target backlight light entity
          brightness: 0.5             # Re-assert brightness to ensure consistency
          
      # Initialize LVGL brightness label at boot (show 50%)
      - lambda: |-
          char buf[10];               // Temporary character buffer for percentage string
          snprintf(buf, sizeof(buf), "%d%%", id(brightness_value)); // Format brightness as percentage string
          lv_label_set_text(id(lbl_brightness), buf); // Update LVGL label with initial brightness value

      # Wait to ensure publish_state takes effect
      - delay: 200ms                    # Give encoder state update time to complete

      # Enable encoder after everything is aligned
      - lambda: |-
          id(encoder_ready) = true;   // Enable encoder processing (system fully initialized)
          
esp32:
  board: esp32-s3-devkitc-1  # Specify ESP32-S3 development board model
  framework:
    type: esp-idf  # Use ESP-IDF framework (instead of Arduino) for better PSRAM support
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y # Overclock CPU to 240MHz for better performance
      CONFIG_ESP32S3_DATA_CACHE_64KB: y      # Enable 64KB data cache for faster memory access
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y    # Allow fetching instructions from PSRAM
      CONFIG_SPIRAM_RODATA: y                # Store read-only data in PSRAM to save SRAM

psram:
  mode: octal                         # Use Octal PSRAM mode (higher bandwidth than quad)
  speed: 80MHz                        # Set PSRAM clock speed to 80MHz

# Enable logging
logger:
