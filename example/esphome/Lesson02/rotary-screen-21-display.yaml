esphome:                                                     # ESPHome project configuration
  name: rotary-screen-21-display                             # Set the device name
  friendly_name: Rotary_Screen_2.1_Display                   # Set the friendly name displayed in Home Assistant
  platformio_options:                                        # Configure PlatformIO build options
    build_flags: "-DBOARD_HAS_PSRAM"                         # Define PSRAM support during compilation
    board_build.esp-idf.memory_type: qio_opi                 # Set the ESP-IDF memory access mode
    board_build.flash_mode: dio                              # Set the Flash operating mode to DIO
  on_boot:                                                   # Define actions to execute when the device boots
    priority: 800                                             # Set the boot automation execution priority
    then:                                                     # Define the actions to execute during boot
      # Bring up panel power before toggling RESET, then small delays. Based on Elecrow sample code, though colors are off
      - output.turn_on: lcd_power                             # Turn on the LCD panel power
      - output.turn_on: display_reset                         # Set the LCD reset control active
      - delay: 100ms                                           # Wait for 100 ms
      - output.turn_off: display_reset                        # Release the LCD reset
      - delay: 100ms                                           # Wait another 100 ms for the display to stabilize

esp32:                                                       # ESP32 platform configuration
  board: esp32-s3-devkitc-1                                  # Select the ESP32-S3-DevKitC-1 board
  framework:                                                  # Configure the ESP32 development framework
    type: esp-idf                                             # Use the ESP-IDF framework
    sdkconfig_options:                                        # Configure ESP-IDF SDK options
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y                 # Set the default CPU frequency to 240 MHz
      CONFIG_ESP32S3_DATA_CACHE_64KB: y                      # Enable a 64 KB data cache
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y                    # Allow instructions to be fetched from PSRAM
      CONFIG_SPIRAM_RODATA: y                                # Allow read-only data to be stored in PSRAM

psram:                                                        # PSRAM configuration
  mode: octal                                                  # Configure PSRAM to use Octal mode
  speed: 80MHz                                                 # Set the PSRAM speed to 80 MHz

# Enable logging                                                # Enable logging
logger:                                                        # ESPHome logger configuration
  level: DEBUG                                                  # Set the logging level to DEBUG

# Enable Home Assistant API                                      # Enable the Home Assistant API
api:                                                          # Configure communication with Home Assistant
  encryption:                                                  # Enable API encryption
    key: "ujcgmEaaZ5Wzdd6DcitbBekVn4LlgjPui32bcwsd1B8="       # Set the API encryption key

ota:                                                          # Configure OTA firmware updates
  - platform: esphome                                          # Use the ESPHome OTA platform
    password: "8d0225cf32c961cdabef364070f2a9e9"              # Set the OTA update password

wifi:                                                         # Wi-Fi configuration
  ssid: !secret wifi_ssid                                      # Load the Wi-Fi SSID from secrets.yaml
  password: !secret wifi_password                              # Load the Wi-Fi password from secrets.yaml

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:                                                          # Configure the fallback Wi-Fi access point
    ssid: "Rotary-Screen-21-Display"                           # Set the fallback hotspot SSID
    password: "uTa2xfhEuMez"                                  # Set the fallback hotspot password

captive_portal:                                                # Enable the captive portal


i2c:                                                          # Configure the I2C bus
  sda: GPIO38                                                  # Set GPIO38 as the I2C SDA pin
  scl: GPIO39                                                  # Set GPIO39 as the I2C SCL pin
  id: bus_a                                                    # Assign an ID to the I2C bus
  scan: true                                                   # Scan the I2C bus for connected devices at startup

pcf8574:                                                       # Configure the PCF8574 I/O expander
  - id: pcf                                                     # Assign an ID to the PCF8574
    address: 0x21                                               # Set the PCF8574 I2C address to 0x21

# Map PCF8574 pins:                                             # Map the PCF8574 pins to their functions
# P0: Touch reset (output)                                      # P0 is used for touch controller reset
# P2: Touch interrupt (input)                                   # P2 is used for the touch interrupt input
# P3: LCD power (output)                                        # P3 is used to control LCD power
# P4: LCD reset (output)                                        # P4 is used to control LCD reset
# P5: Encoder button (input pull-up)                            # P5 is used for the encoder button with pull-up
# (P1, P6, P7 unused here)                                      # P1, P6, and P7 are not used here

output:                                                         # Configure output components
  - platform: ledc                                               # Use the LEDC peripheral to generate PWM
    pin: 6                                                        # Use GPIO6 as the PWM output pin
    id: bl_pwm                                                    # Assign an ID to the backlight PWM output
    frequency: 19531Hz                                            # Set the PWM frequency to 19531 Hz

  - platform: gpio                                                # Use the GPIO output platform
    id: lcd_power                                                  # Assign an ID to the LCD power output
    pin:                                                         # Configure the output pin
      pcf8574: pcf                                               # Use a pin from the PCF8574
      number: 3                                                   # Use PCF8574 pin P3
      mode:                                                       # Configure the pin mode
        output: true                                              # Set the pin as an output
      inverted: false                                             # Do not invert the output logic

  - platform: gpio                                                # Use the GPIO output platform
    id: display_reset                                             # Assign an ID to the display reset output
    pin:                                                         # Configure the output pin
      pcf8574: pcf                                               # Use a pin from the PCF8574
      number: 4                                                   # Use PCF8574 pin P4
      mode:                                                       # Configure the pin mode
        output: true                                              # Set the pin as an output
      inverted: true                                              # Invert the output logic

light:                                                           # Configure the light component
  - platform: monochromatic                                       # Use the monochromatic light platform
    name: "LCD Backlight"                                         # Set the backlight name
    output: bl_pwm                                                # Use bl_pwm as the PWM output
    id: display_backlight                                         # Assign an ID to the LCD backlight
    default_transition_length: 0s                                 # Disable brightness transition effects
    restore_mode: ALWAYS_ON                                       # Always turn on the backlight after boot

spi:                                                             # Configure the SPI bus
  clk_pin: 2                                                      # Set GPIO2 as the SPI clock pin
  mosi_pin: 1                                                     # Set GPIO1 as the SPI MOSI pin

font:                                                            # Configure fonts
  - file: "gfonts://Roboto"                                      # Use the Roboto font from Google Fonts
    id: roboto16                                                  # Assign an ID to the font
    size: 16                                                      # Set the font size to 16 pixels

display:                                                         # Configure the display
  - platform: st7701s                                             # Use the ST7701S display driver
    id: my_display                                                 # Assign an ID to the display
    update_interval: 50ms                                          # Update the display every 50 ms

    spi_mode: MODE3                                                # Set the SPI mode to MODE3
    color_order: RGB                                               # Set the color order to RGB
    invert_colors: false                                           # Do not invert the display colors

    dimensions:                                                    # Configure the display dimensions
      width: 480                                                   # Set the display width to 480 pixels
      height: 480                                                  # Set the display height to 480 pixels

    #reset_pin:                                                     # Configure a dedicated display reset pin
    #  pcf8574: pcf                                                  # Use the PCF8574 for display reset
    #  number: 4                                                     # Use PCF8574 pin P4 for reset

    cs_pin: 16                                                     # Set GPIO16 as the display chip-select pin
    de_pin: 40                                                     # Set GPIO40 as the RGB data-enable pin
    hsync_pin: 15                                                  # Set GPIO15 as the horizontal sync pin
    vsync_pin: 7                                                   # Set GPIO7 as the vertical sync pin
    pclk_pin: 41                                                   # Set GPIO41 as the pixel clock pin
    data_pins:                                                      # Configure the RGB parallel data pins
      red: [46, 3, 8, 18, 17]                                     # Configure the five red data pins
      green: [14, 13, 12, 11, 10, 9]                              # Configure the six green data pins
      blue: [5, 45, 48, 47, 21]                                   # Configure the five blue data pins

    hsync_front_porch: 20                                         # Set the horizontal front porch to 20 clock cycles
    hsync_pulse_width: 10                                         # Set the horizontal sync pulse width to 10 clock cycles
    hsync_back_porch: 10                                          # Set the horizontal back porch to 10 clock cycles
    vsync_front_porch: 8                                          # Set the vertical front porch to 8 clock cycles
    vsync_pulse_width: 10                                          # Set the vertical sync pulse width to 10 clock cycles
    vsync_back_porch: 10                                           # Set the vertical back porch to 10 clock cycles
    show_test_card: false                                           # Display a test pattern for display debugging

    pclk_frequency: 18MHz                                         # Set the pixel clock frequency to 18 MHz
    pclk_inverted: true                                            # Invert the pixel clock signal

    # https://github.com/moononournation/Arduino_GFX/blob/365a70bbca253966c6b89fcb649f11d52e6dbb9d/src/display/Arduino_RGB_Display.cpp
    init_sequence:                                                 # Configure the ST7701S initialization command sequence
      - [0x01]                                                     # Send the software reset command
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]                     # Select the ST7701S command page

      - [0xCC, 0x10]                                               # Configure display control parameters
      - [0xCD, 0x08]                                               # Configure display mode parameters

      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D] # Configure positive gamma parameters
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D] # Configure negative gamma parameters

      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]                    # Switch to another ST7701S command page

      - [0xB0, 0x5D]                                               # Configure display timing parameters
      - [0xB1, 0x43]                                               # Configure display timing parameters
      - [0xB2, 0x81]                                               # Configure display timing parameters
      - [0xB3, 0x80]                                               # Configure display timing parameters

      - [0xB5, 0x43]                                               # Configure VCOM and display electrical parameters

      - [0xB7, 0x85]                                               # Configure gate control parameters
      - [0xB8, 0x20]                                               # Configure gate control parameters

      - [0xC1, 0x78]                                               # Configure power-related parameters
      - [0xC2, 0x78]                                               # Configure power-related parameters

      - [0xD0, 0x88]                                               # Configure power control parameters

      - [0xE0, 0x00, 0x00, 0x02]                                  # Configure gamma parameters

      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20] # Configure gamma parameters

      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] # Configure display parameters

      - [0xE3, 0x00, 0x00, 0x11, 0x00]                           # Configure display timing parameters

      - [0xE4, 0x22, 0x00]                                       # Configure display timing parameters

      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] # Configure gamma and timing parameters

      - [0xE6, 0x00, 0x00, 0x11, 0x00]                           # Configure display timing parameters

      - [0xE7, 0x22, 0x00]                                       # Configure display timing parameters

      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] # Configure display timing and gamma parameters

      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]      # Configure display electrical parameters

      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF] # Configure display driver parameters

      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]             # Configure display control parameters

      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]                  # Switch to another ST7701S command page
      - [0xEF, 0x08]                                            # Configure display control parameters

      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]                  # Return to the default command page

      - [0x36, 0x00]                                             # Configure the display scan direction
      - [0x3A, 0x60]  # 0x70=RGB888, 0x60=RGB666, 0x50=RGB565 # Set the pixel format to RGB666

      - [0x11]                                                    # Exit sleep mode
      - delay 100ms                                               # Wait 100 ms for the display controller to wake up

      - [0x29]                                                    # Turn on the display
      - delay 50ms                                                # Wait 50 ms for display initialization to complete

lvgl:                                                            # Configure the LVGL graphics library
  displays:                                                       # Specify the display used by LVGL
    - my_display                                                   # Use the my_display display
  widgets:                                                        # Define LVGL widgets
    - label:                                                      # Create a label widget
        align: CENTER                                             # Align the label to the center of the screen
        id: lbl_title                                              # Assign an ID to the label
        text_font: montserrat_28                                  # Use the Montserrat 28 font
        text: "Hello World!"                                      # Set the text displayed by the label