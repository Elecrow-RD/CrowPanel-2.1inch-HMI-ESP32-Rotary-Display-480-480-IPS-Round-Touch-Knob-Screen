# LVGL configuration
lvgl:
  displays:
    - my_display                      # Bind LVGL to display
  buffer_size: 50%                    # LVGL draw buffer size
  widgets:
    - label:
        align: CENTER                 # Center alignment
        id: lbl_title                 # Title label ID
        y: 0                          # Vertical offset
        text_font: montserrat_28      # Built-in font
        text: "Knob Screen Brightness"# Title text
    - label:
        align: CENTER                 # Center alignment
        id: lbl_brightness            # Brightness label ID
        y: 50                         # Vertical offset
        text_font: montserrat_48      # Large font for percentage
        text: "50%"                   # Initial placeholder text