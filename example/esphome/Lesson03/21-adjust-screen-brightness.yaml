  scan: true                          # Enable I2C device scanning

pcf8574:
  - id: pcf                           # PCF8574 I/O expander ID
    address: 0x21                     # I2C address of PCF8574
    
output:
  - platform: ledc
    pin: 6                            # PWM pin for backlight
    id: bl_pwm                        # PWM output ID
    frequency: 19531Hz                # PWM frequency

  - platform: gpio
    id: lcd_power                    # LCD power control output
    pin:
      pcf8574: pcf                   # Controlled via PCF8574
      number: 3                      # PCF8574 pin number
      mode:
        output: true                 # Output mode
      inverted: false                # Non-inverted logic

  - platform: gpio
    id: display_reset                # Display reset control
    pin:
      pcf8574: pcf                   # Controlled via PCF8574
      number: 4                      # PCF8574 pin number
      mode:
        output: true                 # Output mode
      inverted: true                 # Inverted reset signal
        
# Global variables (defined only, assigned in code)
globals:
  - id: brightness_value
    type: int                        # Integer brightness value (0–100)
    restore_value: false             # Do not restore from flash
    initial_value: "50"              # Default brightness value

  - id: encoder_ready
    type: bool                       # Flag to enable encoder processing
    restore_value: false             # Do not restore from flash
    initial_value: "false"           # Disabled by default

# Rotary encoder configuration
sensor:
  - platform: rotary_encoder
    id: knob                         # Encoder sensor ID
    name: "Encoder"                  # Sensor name

    pin_a:
      number: 42                          # GPIO pin number for rotary encoder channel A (CLK)
      mode:
        input: true                       # Set the pin to input mode (required for reading encoder signals)
        pullup: true                      # Enable internal pull-up resistor to stabilize signal (prevents floating voltage)
    pin_b:
      number: 4                           # GPIO pin number for rotary encoder channel B (DT/DATA)
      mode:
        input: true                       # Set the pin to input mode (required for reading encoder signals)
        pullup: true                      # Enable internal pull-up resistor to stabilize signal (prevents floating voltage)

    filters:
      - debounce: 20ms              # Debounce filter
      - lambda: return round(x);     # Round encoder value

    resolution: 1                    # Encoder resolution
    internal: true 

    on_value:
          then:
            - lambda: |-
                // Skip encoder processing if system initialization is not complete
                if (!id(encoder_ready)) {
                  return;                // Ignore encoder events until ready
                }
                // Static variables retain value between callback executions
                static bool first_run = true;   // First run flag (initialize state alignment)
                static int last_encoder = 0;   // Store last encoder reading for delta calculation
                // Get current encoder sensor value and cast to integer
                int current = (int) id(knob).state; // Current encoder state

                // First callback: only align state, do not change brightness
                if (first_run) {
                  last_encoder = current;  // Sync last_encoder with current encoder value
                  first_run = false;       // Disable first run flag after initialization
                  return;                  // Exit without brightness adjustment
                }
                
                // Calculate the difference between current and last encoder values
                int delta = current - last_encoder; // Calculate movement delta
                last_encoder = current;              // Update last value for next iteration

                // Exit if there's no effective encoder movement (delta = 0)
                if (delta == 0) {
                  return;  // No effective movement
                }

                // use delta directly (direction-correct & symmetric)
                // Adjust brightness value based on encoder rotation direction
                if (delta < 0) {
                  id(brightness_value) += 5;   // Increase brightness by 5% for left rotation
                } else {
                  id(brightness_value) -= 5;   // Decrease brightness by 5% for right rotation
                }

                // Clamp brightness range to ensure value stays within 0-100%
                if (id(brightness_value) < 0) id(brightness_value) = 0;    // Minimum brightness limit (0%)
                if (id(brightness_value) > 100) id(brightness_value) = 100; // Maximum brightness limit (100%)

                // Key: Directly write PWM (no queue, no delay)
                // Convert brightness percentage (0-100) to PWM level (0.0-1.0)
                float level = id(brightness_value) / 100.0f;
                // Set PWM output level for backlight (immediate hardware control)
                id(bl_pwm).set_level(level);

                // Update LVGL (This is a slow process, but it doesn't affect the brightness)
                // Temporary buffer to store formatted brightness percentage text
                char buf[10];
                // Format brightness value as percentage string (e.g., "50%")
                snprintf(buf, sizeof(buf), "%d%%", id(brightness_value));
                // Update LVGL label with new brightness value
                lv_label_set_text(id(lbl_brightness), buf);
                // Force immediate LVGL screen refresh to show updated value
                lv_refr_now(NULL);

# Backlight light component
light:
  - platform: monochromatic
    name: "LCD Backlight"             # Light entity name
    output: bl_pwm                    # PWM output
    id: display_backlight             # Light ID
    default_transition_length: 0s     # No fade transition
    restore_mode: ALWAYS_ON           # Always turn on after boot

spi:
  clk_pin: 2                          # SPI clock pin
  mosi_pin: 1                         # SPI MOSI pin

# Display driver configuration
display:
  - platform: st7701s                 # ST7701S display driver
    id: my_display                    # Display ID
    update_interval: 50ms             # Refresh interval
    spi_mode: MODE3                   # SPI mode
    color_order: RGB                  # RGB color order
    invert_colors: false              # Do not invert colors
    dimensions:
      width: 480                      # Display width
      height: 480                     # Display height
    cs_pin: 16                        # Chip select pin
    de_pin: 40                        # Data enable pin
    hsync_pin: 15                     # Horizontal sync pin
    vsync_pin: 7                      # Vertical sync pin
    pclk_pin: 41                      # Pixel clock pin
    data_pins:
      red: [46, 3, 8, 18, 17]          # Red channel data pins
      green: [14, 13, 12, 11, 10, 9]   # Green channel data pins
      blue: [5, 45, 48, 47, 21]        # Blue channel data pins
    hsync_front_porch: 20              # HSYNC front porch
    hsync_pulse_width: 10              # HSYNC pulse width
    hsync_back_porch: 10               # HSYNC back porch
    vsync_front_porch: 8               # VSYNC front porch
    vsync_pulse_width: 10              # VSYNC pulse width
    vsync_back_porch: 10               # VSYNC back porch
    show_test_card: false              # Disable test pattern
    pclk_frequency: 18MHz              # Pixel clock frequency
    pclk_inverted: true                # Invert pixel clock
    init_sequence:
      - [0x01]
