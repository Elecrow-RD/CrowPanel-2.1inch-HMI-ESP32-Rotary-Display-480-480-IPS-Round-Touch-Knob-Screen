esphome:
  name: 21-adjust-screen-brightness
  friendly_name: 2.1_Adjust_Screen_Brightness
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"  # Enable PSRAM support at compile time
    board_build.esp-idf.memory_type: qio_opi  # Flash memory type configuration
    board_build.flash_mode: dio       # Flash mode configuration

  on_boot:
    priority: 800                     # High priority boot sequence
    then:
      # Power and reset initialization
      - output.turn_on: lcd_power       # Turn on LCD power
      - output.turn_on: display_reset   # Assert display reset
      - delay: 100ms                    # Wait for reset timing
      - output.turn_off: display_reset  # Release display reset
      - delay: 100ms                    # Allow display to stabilize

      # Wait for rotary encoder to stabilize
      - delay: 500ms

      # Initial brightness (0.5 = 50%)
      - light.turn_on:
          id: display_backlight       # Backlight light entity
          brightness: 0.5             # Set brightness to 50%

      # === Initialize brightness and encoder (frozen state) ===
      - lambda: |-
          id(encoder_ready) = false;  // Disable encoder processing
          id(brightness_value) = 50;  // Set internal brightness value to 50%

          // Force rotary_encoder internal state to align with 50
          id(knob).publish_state(0);

      # Initial brightness again (ensure light state is correct)
      - light.turn_on:
          id: display_backlight       # Backlight light entity
          brightness: 0.5             # Set brightness to 50%
          
      # Initialize LVGL brightness label at boot (show 50%)
      - lambda: |-
          char buf[10];               // Temporary buffer for text
          snprintf(buf, sizeof(buf), "%d%%", id(brightness_value)); // Format percentage
          lv_label_set_text(id(lbl_brightness), buf); // Update LVGL label

      # Wait to ensure publish_state takes effect
      - delay: 200ms

      # Enable encoder after everything is aligned
      - lambda: |-
          id(encoder_ready) = true;   // Allow encoder events to be processed

